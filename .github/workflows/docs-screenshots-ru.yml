name: Create Russian documentation screenshots
on:
  push:
    branches: [docs/russian-localization-security-licensing-v2.2.5]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot renderer
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate Russian empty-state screenshots
        run: node scripts/capture-docs-screenshots.cjs --lang=ru
      - name: Check screenshot sizes and PNG headers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct
          names=('tv-setup','tv-pairing-demo','phone-home-empty','phone-subscriptions-empty','phone-settings','phone-import-empty')
          for n in names:
              p=Path('assets/screenshots')/(n+'-ru.png')
              data=p.read_bytes()
              assert data[:8]==bytes.fromhex('89504e470d0a1a0a')
              w,h=struct.unpack('>II',data[16:24])
              assert (w,h)==((1280,720) if n.startswith('tv-') else (860,1864)),(n,w,h)
              assert len(data)>10000,n
              print('validated',p,w,h,len(data))
          PY
      - name: Commit sanitized screenshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/screenshots/*-ru.png
          if ! git diff --cached --quiet; then
            git commit -m 'docs: render six authentic Russian empty-state screenshots'
            git push origin HEAD:docs/russian-localization-security-licensing-v2.2.5
          fi
