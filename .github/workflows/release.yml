name: Publish verified release artifacts
on:
  push:
    tags:
      - 'v*'
    # A one-time, owner-approved publication branch. The connected GitHub
    # integration cannot create Git tags; this branch uses the SAME tested
    # release job and action-gh-release to create immutable v2.2.6 assets.
    branches:
      - 'publish/v2.2.6'
permissions:
  contents: write
jobs:
  release:
    if: github.ref == 'refs/heads/publish/v2.2.6' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.2.6' }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate the approved release tag and version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("launcher/appinfo.json"))["version"])')"
          test "$RELEASE_TAG" = "v$VERSION" || { echo "Tag/version mismatch"; exit 1; }
          if [[ "$GITHUB_REF" == refs/heads/* ]]; then
            test "$GITHUB_REF" = 'refs/heads/publish/v2.2.6'
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              echo "Release tag already exists; refusing to overwrite existing assets"
              exit 1
            fi
          fi
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache-dependency-path: server/go.mod
      - name: Build
        run: bash scripts/build-release.sh
      - name: Test
        run: bash tests/run_offline.sh
      - name: Generate Homebrew metadata
        env:
          TARGET_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          python3 scripts/make-manifest.py --repository "$TARGET_REPOSITORY" --tag "$RELEASE_TAG"
          python3 scripts/make-homebrew-entry.py --repository "$TARGET_REPOSITORY"
          (cd dist && sha256sum *.ipk *.manifest.json > SHA256SUMS)
      - name: Publish release (manual reviewer approval still required for Homebrew index)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: CVPN webOS ${{ env.RELEASE_TAG }} Stable
          body: |
            ## CVPN webOS 2.2.6 — Homebrew packaging compatibility

            **Xray/VLESS VPN for rooted LG webOS TVs** supporting TCP, XHTTP
            and gRPC transports. Import compatible VLESS links, HTTPS
            subscriptions and Xray JSON from any provider.
            A CVPN subscription is optional; the app is free to use.

            ### Changes from v2.2.5
            - Homebrew-compatible IPK control/data member paths and installed size.
            - Included CVPN proprietary license and third-party notices in IPK.
            - Updated English app description and release metadata.
            - No changes to VPN Engine, Xray, root installation, user settings,
              subscriptions, or TV user interface.

            ### Compatibility and precautions
            Root, Homebrew Channel root service, compatible 32-bit ARMv7
            userspace, and TUN are required. Oldest verified webOS: 4.4.3-22.
            Owner reports working CVPN on LG 55UK6450PLC, 65UK6710PLB,
            86NANO906NA and 55UQ76003LD. Previous real-TV validation
            covered earlier builds; v2.2.6 changes packaging only.

            IPv4 VPN only; no universal kill switch or VPN autoconnect.
            Use port 8765 over a trusted private LAN only.
            Disconnect VPN before installing the new IPK.
            Verify its integrity using the published SHA256SUMS.

            Xray-core remains MPL-2.0; QR libraries retain MIT/Apache-2.0.
            CVPN-authored code is proprietary but free to use.
            AI-assisted development was iterated and tested on LG hardware.

          files: |
            dist/*.ipk
            dist/*.manifest.json
            dist/*.yml
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          generate_release_notes: true
